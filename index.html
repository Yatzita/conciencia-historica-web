<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciencia Historica</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    
    <form method="post" class="formulario" action="historia.html">
        <h2>¡Bienvenido!</h2>
        <p class="subtitulo">Ingresa tus datos para continuar</p>
        
        <div class="grupo-input">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        </div>

        <div class="grupo-input">
            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos" required>
        </div>

        <div class="grupo-input">
            <label for="grupo">Grupo</label>
            <select id="grupo" name="grupo" required>
                <option value="">Selecciona tu grupo</option>
                <option value="5AMP">5AMP</option>
                <option value="5AMS">5AMS</option>
                <option value="5AMC">5AMC</option>
                <option value="5BMC">5BMC</option>
                <option value="5AMN">5AMN</option>
                <option value="5AMM">5AMM</option>
            </select>
        </div>

        <div class="grupo-input">
            <label for="nivel">Nivel de Conocimientos</label>
            <select id="nivel" name="nivel" required>
                <option value="">Selecciona tu nivel</option>
                <option value="basico">Básico</option>
                <option value="medio">Medio</option>
                <option value="avanzado">Avanzado</option>
            </select>
        </div>

        <div class="grupo-boton">
            <input type="submit" value="Comenzar">
            <a href="historia.html"></a>
        </div>
    </form>

</body>
</html>
