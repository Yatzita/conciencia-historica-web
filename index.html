        <option value="">Selecciona tu grupo</option>

        <option value="5AMC">5AMC</option>
        <option value="5BMC">5BMC</option>

        <option value="5AMM">5AMM</option>

    <br><br>

    <label>Nivel:</label>

        <option value="avanzado">Avanzado</option>

    </form>
